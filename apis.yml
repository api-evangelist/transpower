aid: transpower

name: Transpower New Zealand

description: Transpower New Zealand is the national electricity transmission system operator, owning and operating the high‑voltage grid that
  delivers power across the country. It ensures reliable supply, manages grid connections, and supports New Zealand’s transition to a low‑carbon,
  renewable energy future. The company provides market data, system operator services, and works closely with industry, government and communities
  to secure the nation’s electricity infrastructure.

